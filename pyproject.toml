[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termiplane"
version = "0.1.0"
description = "Follow a single aircraft live in your terminal using keyless ADS-B data"
readme = "README.md"
license = "MIT"
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
termiplane = "termiplane:main"

[tool.setuptools]
py-modules = ["termiplane", "termiplane_land"]
packages = ["termiplane_maps"]

[tool.setuptools.package-data]
termiplane_maps = ["*.json.gz", "README.md"]
